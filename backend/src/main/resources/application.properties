spring.application.name=backend
server.port=8080

# --- Database Configuration (H2 in-memory by default for instant local launch, PostgreSQL when SPRING_DATASOURCE_URL is set) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tripsheriff;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- PayPal Sandbox Configuration (Task C, D, E) ---
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.mock-mode=${PAYPAL_MOCK_MODE:false}
paypal.brand-name=TripSheriff AI
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}

# Base URL for callbacks (return_url, cancel_url)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- Swagger / OpenAPI UI Configuration ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:tripSheriffProductionGradeHmacSha256SecretKeyWhichIsAtLeast32Bytes!}
app.jwt.expiration-ms=86400000

# --- Actuator & Observability ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
