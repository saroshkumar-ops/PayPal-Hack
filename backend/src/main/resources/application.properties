spring.application.name=backend
server.port=8080

# --- Database Configuration (H2 in-memory for fast prototyping & testing) ---
spring.datasource.url=jdbc:h2:mem:tripsheriff;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Future PostgreSQL Switch (Uncomment when PostgreSQL DB is spun up) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/tripsheriff
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- PayPal Sandbox Configuration (Task C, D, E) ---
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.mock-mode=${PAYPAL_MOCK_MODE:false}
paypal.brand-name=TripSheriff AI

# Base URL for callbacks (return_url, cancel_url)
app.base-url=${APP_BASE_URL:http://localhost:8080}

